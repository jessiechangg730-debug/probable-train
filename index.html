@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#182b28;font-family:'DM Sans','Noto Sans TC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:76px;background:#fff;border-bottom:1px solid #e8ece8;display:flex;align-items:center;justify-content:space-between;padding:0 max(6%,calc((100vw - 1320px)/2));} .brand{font-size:21px;font-weight:700;letter-spacing:-.8px}.brand b{display:inline-grid;place-items:center;background:#195c4d;color:white;border-radius:9px;width:32px;height:32px;margin-right:8px}.nav{display:flex;gap:34px;color:#697a75;font-size:14px}.nav strong{color:#195c4d}.pill{border:1px solid #dce5df;border-radius:99px;padding:9px 15px;color:#3e5a52;font-size:13px}.hero{background:#e7f0ea;position:relative;overflow:hidden;padding:57px max(6%,calc((100vw - 1320px)/2)) 94px}.hero:after{content:'✈';position:absolute;font-size:190px;right:12%;top:5px;transform:rotate(-18deg);color:#d0e3d5;opacity:.8}.eyebrow{font-size:12px;letter-spacing:2.2px;font-weight:700;color:#598071}.hero h1{font-size:42px;letter-spacing:-2px;margin:13px 0 12px}.hero p{color:#688078;margin:0;font-size:15px}.wrap{max-width:1320px;margin:auto;padding:0 24px}.search{position:relative;margin-top:-58px;background:white;border-radius:15px;padding:23px 26px 26px;box-shadow:0 12px 38px #203b2c13;z-index:1}.tabs{display:flex;gap:9px;margin-bottom:21px}.tab{background:#f2f5f1;border:0;border-radius:7px;padding:8px 16px;color:#76877d;font-size:13px}.tab.active{background:#e4f0e9;color:#1d6753;font-weight:700}.fields{display:grid;grid-template-columns:1.15fr 1.15fr 1fr 1fr .8fr auto;gap:10px}.field{border:1px solid #e4eae5;border-radius:9px;padding:10px 12px;min-width:0}.field label{display:block;font-size:11px;color:#88978f;margin-bottom:5px}.field input,.field select{border:0;outline:0;background:transparent;color:#243d34;width:100%;font-size:14px;font-weight:600}.searchbtn{background:#1b654f;color:white;border:0;border-radius:9px;padding:0 25px;font-weight:700}.main{display:grid;grid-template-columns:250px 1fr;gap:30px;margin:42px auto 70px}.side h3,.results h3{margin:0}.side h3{font-size:17px}.sidehead{display:flex;justify-content:space-between;align-items:center}.reset{border:0;background:none;color:#3c8068;font-size:12px}.filter{border-bottom:1px solid #e1e8e1;padding:25px 0}.filter strong{display:block;font-size:13px;margin-bottom:15px}.filter label{display:flex;justify-content:space-between;margin:12px 0;color:#62746b;font-size:13px}.filter input{accent-color:#1b654f}.filter input[type=range]{width:100%}.hint{font-size:12px;color:#82928a}.results-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:19px}.results-top h2{font-size:23px;margin:0 0 6px;letter-spacing:-.5px}.results-top p{font-size:13px;color:#87958d;margin:0}.sort{border:1px solid #e0e8e0;background:white;color:#536b5e;padding:10px;border-radius:8px;font-size:12px}.notice{background:#fff8e8;color:#8a6a29;border:1px solid #f1e3be;border-radius:8px;padding:11px 14px;font-size:12px;margin-bottom:14px}.card{background:white;border:1px solid #e8eee8;border-radius:12px;margin-bottom:13px;padding:20px 22px;display:grid;grid-template-columns:1.2fr 2.5fr 1fr;align-items:center;gap:20px}.airline{display:flex;align-items:center;gap:12px}.logo{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700;font-size:13px}.airline b{font-size:14px}.airline small,.flight small,.price small{display:block;color:#94a199;font-size:11px;margin-top:5px}.flight{display:flex;align-items:center;gap:16px}.flight b{font-size:21px;letter-spacing:-.5px}.line{flex:1;text-align:center;color:#9eada2;font-size:11px;min-width:90px}.line i{display:block;border-top:1px solid #d5ded7;margin:7px 0;position:relative}.line i:after{content:'✈';position:absolute;right:0;top:-9px;color:#7e9a87;font-style:normal}.price{text-align:right;border-left:1px solid #eef1ec}.price b{font-size:22px;color:#1a654e}.price button{background:#eff6f1;color:#226d53;border:0;border-radius:7px;padding:8px 17px;margin-top:10px;font-size:12px;font-weight:700}.empty{background:white;padding:40px;text-align:center;border-radius:12px;color:#73867c}.foot{font-size:12px;color:#97a59c;text-align:center;padding:20px}.badge{font-size:10px;background:#e6f3e9;color:#438461;padding:4px 7px;border-radius:4px;margin-left:6px}@media(max-width:850px){.fields{grid-template-columns:repeat(2,1fr)}.searchbtn{min-height:48px}.main{grid-template-columns:1fr}.side{display:flex;gap:20px;overflow:auto}.filter{min-width:150px;padding:0}.sidehead{display:none}.card{grid-template-columns:1fr 2fr}.price{grid-column:1/-1;text-align:left;border:0;display:flex;align-items:center;justify-content:space-between}.hero:after{right:2%;opacity:.4}}@media(max-width:520px){header{padding:0 20px}.nav{display:none}.hero{padding:45px 24px 90px}.hero h1{font-size:32px}.wrap{padding:0 16px}.fields{grid-template-columns:1fr 1fr}.main{margin-top:28px}.card{grid-template-columns:1fr}.flight{grid-row:2}.price{grid-column:auto}.results-top{align-items:start;gap:10px}.results-top h2{font-size:20px}}
</style></head><body><header><div class="brand"><b>↗</b> fare atlas<span style="color:#7da894">.</span></div><div class="nav"><strong>探索航班</strong><span>找到下一趟旅程</span></div><div class="pill">繁體中文 · TWD</div></header><section class="hero"><div class="eyebrow">A BETTER WAY TO GET THERE</div><h1>下一趟旅行，從這裡開始。</h1><p>比較航班選擇，找到適合你的價格與旅程。</p></section><div class="wrap"><form class="search" id="form"><div class="tabs"><button class="tab active" type="button" data-trip="round">來回</button><button class="tab" type="button" data-trip="one">單程</button></div><div class="fields"><div class="field"><label>出發地</label><select id="from"><option value="TPE">台北 (TPE)</option><option value="KHH">高雄 (KHH)</option><option value="NRT">東京 (NRT)</option><option value="ICN">首爾 (ICN)</option></select></div><div class="field"><label>目的地</label><select id="to"><option value="NRT">東京 (NRT)</option><option value="ICN">首爾 (ICN)</option><option value="KIX">大阪 (KIX)</option><option value="TPE">台北 (TPE)</option></select></div><div class="field"><label>出發日期</label><input type="date" id="depart" required></div><div class="field" id="returnField"><label>回程日期</label><input type="date" id="return"></div><div class="field"><label>旅客</label><select id="travellers"><option value="1">1 位成人</option><option value="2">2 位成人</option><option value="3">3 位成人</option><option value="4">4 位成人</option></select></div><button class="searchbtn">搜尋航班 ↗</button></div></form><main class="main"><aside class="side"><div class="sidehead"><h3>篩選條件</h3><button class="reset" id="reset">重設</button></div><div class="filter"><strong>轉機次數</strong><label><span><input type="checkbox" value="0" class="stop"> 直飛</span></label><label><span><input type="checkbox" value="1" class="stop"> 轉機 1 次</span></label></div><div class="filter"><strong>每人預算上限</strong><input id="budget" type="range" min="3000" max="30000" step="1000" value="30000"><div class="hint" id="budgetText">NT$ 30,000 以下</div></div><div class="filter"><strong>關於票價</strong><div class="hint" style="line-height:1.8">目前顯示示範資料，協助體驗搜尋與篩選功能。</div></div></aside><section class="results"><div class="results-top"><div><h2 id="route">台北 <span style="color:#a2b4a8">→</span> 東京</h2><p id="summary">探索適合你的航班</p></div><select class="sort" id="sort" aria-label="排序"><option value="price">價格由低到高</option><option value="duration">飛行時間最短</option></select></div><div class="notice">示範模式：以下航班與價格為模擬資料，並非即時報價，無法用於訂票。</div><div id="list"></div></section></main><div class="foot">fare atlas · 讓每一次出發，都更從容。</div></div><script>
const names={TPE:'台北',KHH:'高雄',NRT:'東京',ICN:'首爾',KIX:'大阪'};const flights=[{air:'星宇航空',code:'JX 800',color:'#9d8569',start:'08:30',end:'12:40',duration:190,price:8260,stop:0},{air:'台灣虎航',code:'IT 200',color:'#e68446',start:'06:45',end:'11:05',duration:200,price:6890,stop:0},{air:'長榮航空',code:'BR 198',color:'#238066',start:'09:10',end:'13:15',duration:185,price:10480,stop:0},{air:'亞洲航空',code:'AK 151',color:'#d7605a',start:'11:20',end:'19:35',duration:435,price:7240,stop:1}];let trip='round';const $=id=>document.getElementById(id);let today=new Date();today.setDate(today.getDate()+21);$('depart').value=today.toISOString().slice(0,10);today.setDate(today.getDate()+5);$('return').value=today.toISOString().slice(0,10);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{trip=b.dataset.trip;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('returnField').style.display=trip==='one'?'none':''});function render(){let from=$('from').value,to=$('to').value;$('route').innerHTML=`${names[from]} <span style="color:#a2b4a8">→</span> ${names[to]}`;let stops=[...document.querySelectorAll('.stop:checked')].map(x=>+x.value),budget=+$('budget').value;let list=flights.filter(f=>(!stops.length||stops.includes(f.stop))&&f.price<=budget).sort((a,b)=>a[$('sort').value]-b[$('sort').value]);$('summary').textContent=`${$('depart').value} ${trip==='round'?'– '+$('return').value:'· 單程'} · ${$('travellers').value} 位成人 · ${list.length} 個示範選項`;$('budgetText').textContent=`NT$ ${budget.toLocaleString()} 以下`;$('list').innerHTML=list.length?list.map((f,i)=>`<article class="card"><div class="airline"><div class="logo" style="background:${f.color}">${f.air.slice(0,1)}</div><div><b>${f.air}</b>${i===0?'<span class="badge">最低價格</span>':''}<small>${f.code} · 經濟艙</small></div></div><div class="flight"><div><b>${f.start}</b><small>${from}</small></div><div class="line">${Math.floor(f.duration/60)} 小時 ${f.duration%60} 分<i></i>${f.stop?'轉機 1 次':'直飛'}</div><div><b>${f.end}</b><small>${to}</small></div></div><div class="price"><div><b>NT$ ${f.price.toLocaleString()}</b><small>每人示範票價</small></div><button type="button" onclick="alert('這是示範航班，尚未串接即時票價或訂票服務。')">查看詳情 ↗</button></div></article>`).join(''):'<div class="empty">找不到符合條件的示範航班，試著調整篩選條件。</div>'} $('form').onsubmit=e=>{e.preventDefault();if($('from').value===$('to').value){alert('出發地與目的地不能相同。');return}if(trip==='round'&&(!$('return').value||$('return').value<$('depart').value)){alert('請選擇出發日當天或之後的回程日期。');return}render()};document.querySelectorAll('.stop').forEach(x=>x.onchange=render);$('budget').oninput=render;$('sort').onchange=render;$('reset').onclick=()=>{document.querySelectorAll('.stop').forEach(x=>x.checked=false);$('budget').value=30000;render()};render();
</script></body></html>
